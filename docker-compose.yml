services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB}
      DB_OWNER_USER: ${DB_OWNER_USER}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dev-only S3-compatible storage. The official MinIO Docker images were
  # pulled from every public registry we could find (Docker Hub deleted
  # them, quay.io/minio and bitnami/minio are unreachable too -- MinIO's
  # community edition went source-only in 2026). Garage is a maintained,
  # actively published S3-compatible server, used here as a drop-in dev
  # replacement; production uses Cloudflare R2/AWS S3 directly either way
  # (SPEC.md section 4), so the app code never knows the difference.
  garage:
    image: dxflrs/garage:v1.3.1
    restart: unless-stopped
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "${S3_PORT:-9000}:3900"
    healthcheck:
      # dxflrs/garage ships a single static binary with no shell, so the
      # healthcheck must exec it directly instead of using CMD-SHELL.
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "node", "id", "-q"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  garage-init:
    image: alpine:3.23
    depends_on:
      garage:
        condition: service_healthy
    network_mode: "service:garage"
    pid: "service:garage"
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./docker/garage/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

volumes:
  postgres-data:
  garage-meta:
  garage-data:
