name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: changdee
  POSTGRES_TEST_DB: changdee_test
  DB_OWNER_USER: changdee_owner
  DB_OWNER_PASSWORD: ci_owner_password
  DB_APP_USER: changdee_app
  DB_APP_PASSWORD: ci_app_password
  PGHOST: localhost
  PGPORT: 5432
  APP_URL: http://localhost:3000
  NODE_ENV: test
  DATABASE_URL: postgres://changdee_owner:ci_owner_password@localhost:5432/changdee
  DATABASE_APP_URL: postgres://changdee_app:ci_app_password@localhost:5432/changdee
  DATABASE_TEST_URL: postgres://changdee_owner:ci_owner_password@localhost:5432/changdee_test
  DATABASE_TEST_APP_URL: postgres://changdee_app:ci_app_password@localhost:5432/changdee_test

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: changdee
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # docker-compose runs this automatically via docker-entrypoint-initdb.d
      # for local dev; GitHub Actions service containers don't support that,
      # so it's run explicitly here against the already-running service.
      - name: Bootstrap least-privilege database roles
        run: bash docker/postgres/init/01-roles-and-databases.sh

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test
